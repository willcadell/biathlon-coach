[build]
  command = "npm run build"
  publish = "dist"

# Headers every response carries. Not a full Content-Security-Policy yet: that
# needs the exact list of hosts the app talks to tested against it first.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
